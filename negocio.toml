# Os dados do negócio. Fonte única: todo lugar do site que mostra endereço,
# WhatsApp, e-mail ou horário lê daqui — pelo marcador {{campo}} no .md.
#
# TOML: TODO valor de texto vai entre aspas, e toda linha que não é
# `chave = "valor"` precisa começar com # para ser comentário.
#
# Campo vazio = PENDÊNCIA. O site ainda é gerado, mas mostra "[a preencher]"
# em destaque no lugar, e `python gerar.py --publicar` se recusa a gerar
# enquanto houver algum. Assim nada vai ao ar pela metade sem ninguém ver.

nome = "Ateliê de Ótica"
dominio = "ateliedeotica.com.br"
cidade = "Porto Alegre"
uf = "RS"

# Só dígitos, com 55 e DDD — é o que o link do WhatsApp precisa.
whatsapp = "5551993231660"
# Como aparece escrito na página.
whatsapp_legivel = "(51) 99323-1660"

email = "ateliedeotica@gmail.com"

endereco = "Rua Bom Jesus, 178 — Bairro Bom Jesus"
cep = "91420-030"

horarios = "Com hora marcada"

instagram = "ateliedeotica"

# Mensagem que já vem escrita quando a pessoa toca em "Agendar pelo WhatsApp".
mensagem_agendar = "Olá, Bruno! Vi o site do Ateliê e gostaria de marcar um horário."

# A marca deste sítio. É o que a ferramenta (atelie-gerador) NÃO sabe sozinha:
# como o nome se escreve, o que o botão do topo faz e como o Google deve
# entender o negócio. O sítio dos livros terá a sua própria tabela.
[marca]
palavra_destaque = "Ateliê"
palavra_resto = "de Ótica"
tagline = ["Ótica com hora marcada em Porto Alegre.", "Critério no lugar da marca."]
cta_rotulo = "Agendar"
cta_destino = "whatsapp:agendar"
schema_tipo = "Optician"
schema_descricao = "Ótica com hora marcada. Armações e lentes escolhidas por critério técnico, não por marca."
